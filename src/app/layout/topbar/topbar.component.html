<header class="topbar">
  <button
    class="btn btn-icon menu-toggle"
    type="button"
    aria-label="Open menu"
    (click)="menuToggle.emit()"
  >
    <span class="icon icon-menu"></span>
  </button>

  <h1 class="title">{{ title$ | async }}</h1>

  <span class="spacer"></span>

  @if (user$ | async; as user) {
    <div class="user">
      <button
        class="user-button"
        type="button"
        aria-label="Account menu"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen"
        (click)="toggleMenu()"
      >
        <span class="who">
          <strong>{{ fullName }}</strong>
          <small>{{ roleLabel }}</small>
        </span>
        <span class="avatar" aria-hidden="true">{{ initials }}</span>
      </button>

      @if (menuOpen) {
        <div class="menu" role="menu">
          @if (profileRoute) {
            <a role="menuitem" [routerLink]="profileRoute" (click)="menuOpen = false">
              <span class="icon icon-user"></span>
              My profile
            </a>
          } @else {
            <!-- Teachers and administrators have no profile page yet: the password page is all there is. -->
            <a role="menuitem" routerLink="/account/password" (click)="menuOpen = false">
              <span class="icon icon-key"></span>
              Change password
            </a>
          }
          <button role="menuitem" type="button" (click)="signOut()">
            <span class="icon icon-logout"></span>
            Sign out
          </button>
        </div>
      }
    </div>
  }
</header>
